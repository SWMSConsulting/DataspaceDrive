# Instanz für dave (windx-Dataspace). Die Geheimnisse liegen im Secret dataspace-drive-dave-secrets
# (Schlüssel edc-api-key, delivery-token-key-1); Anlage siehe README, Abschnitt Deployment.
fullnameOverride: dataspace-drive-dave

participant:
  id: "did:web:dave-windx.cluster.swms-cloud.com"
  bpn: "BPNL00000000WD04"
  dspAddress: "https://dave-edc-windx.cluster.swms-cloud.com/api/v1/dsp"
  organization: "Dave (windx-Demo)"

edc:
  managementUrl: "http://dave-edc-controlplane:8081/management"

ingress:
  host: drive-dave-windx.cluster.swms-cloud.com
  tlsSecretName: dataspace-drive-dave-tls

existingSecret: dataspace-drive-dave-secrets

storage:
  size: 5Gi

# Gemeinsame Demo-Dienste aus deploy/windx-shared (ein Keycloak-Realm je Unternehmen, ein ClamAV für alle).
oidc:
  authority: https://sso-windx.cluster.swms-cloud.com/realms/dave

scanning:
  clamavHost: clamav.windx-shared.svc.cluster.local

# Demo: alle E-Mails landen im Mailpit in windx-shared (nichts geht nach außen).
mail:
  smtpHost: mailpit.windx-shared.svc.cluster.local
  smtpPort: 1025
  from: "DataspaceDrive Dave <drive@dave.windx.example>"
