{{- if and .Values.secrets.create (not .Values.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "drive.fullname" . }}
  labels:
    {{- include "drive.labels" . | nindent 4 }}
type: Opaque
stringData:
  edc-api-key: {{ required "secrets.edcApiKey ist Pflicht, wenn secrets.create=true" .Values.secrets.edcApiKey | quote }}
  delivery-token-key-1: {{ required "secrets.deliveryTokenKey ist Pflicht (Base64, mind. 32 Bytes)" .Values.secrets.deliveryTokenKey | quote }}
{{- end }}
