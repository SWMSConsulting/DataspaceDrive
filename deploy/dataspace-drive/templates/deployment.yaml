apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "drive.fullname" . }}
  labels:
    {{- include "drive.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # RWO-PVC: der alte Pod muss weg sein, bevor der neue das Volume einhängt.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "drive.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "drive.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: dataspace-drive
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.ports.app }}
            - name: content
              containerPort: {{ .Values.ports.content }}
          env:
            - name: Drive__Ports__App
              value: {{ .Values.ports.app | quote }}
            - name: Drive__Ports__Content
              value: {{ .Values.ports.content | quote }}
            - name: Drive__Participant__Id
              value: {{ .Values.participant.id | quote }}
            - name: Drive__Participant__Bpn
              value: {{ .Values.participant.bpn | quote }}
            - name: Drive__Participant__DspAddress
              value: {{ .Values.participant.dspAddress | quote }}
            - name: Drive__Participant__Organization
              value: {{ .Values.participant.organization | quote }}
            # Adresse, unter der die eigene Dataplane den Content-Endpunkt erreicht (steht in jedem Zustell-Asset).
            - name: Drive__Sharing__ContentBaseUrl
              value: "http://{{ include "drive.fullname" . }}-edc.{{ .Release.Namespace }}.svc.cluster.local:{{ .Values.ports.content }}"
            - name: Drive__Sharing__InstanceId
              value: {{ include "drive.fullname" . | quote }}
            - name: Drive__Sharing__DefaultLifetime
              value: "{{ int .Values.sharing.defaultLifetimeDays }}.00:00:00"
            - name: Drive__Sharing__MaxLifetime
              value: "{{ int .Values.sharing.maxLifetimeDays }}.00:00:00"
            - name: Drive__Sharing__ContractProfile
              value: {{ .Values.sharing.contractProfile | quote }}
            - name: Drive__Sharing__RequireApproval
              value: {{ .Values.sharing.requireApproval | quote }}
            - name: Drive__Mail__SmtpHost
              value: {{ .Values.mail.smtpHost | quote }}
            - name: Drive__Mail__SmtpPort
              value: {{ .Values.mail.smtpPort | quote }}
            - name: Drive__Mail__UseStartTls
              value: {{ .Values.mail.useStartTls | quote }}
            - name: Drive__Mail__Username
              value: {{ .Values.mail.username | quote }}
            - name: Drive__Mail__Password
              valueFrom:
                secretKeyRef:
                  name: {{ include "drive.secretName" . }}
                  key: smtp-password
                  optional: true
            - name: Drive__Mail__From
              value: {{ .Values.mail.from | quote }}
            - name: Drive__Mail__PublicUrl
              value: "https://{{ .Values.ingress.host }}"
            - name: Drive__Inbox__PollInterval
              value: {{ .Values.inbox.pollInterval | quote }}
            - name: Drive__Inbox__SegmentSize
              value: {{ .Values.inbox.segmentSizeBytes | int64 | quote }}
            - name: Drive__Edc__ManagementUrl
              value: {{ .Values.edc.managementUrl | quote }}
            - name: Drive__Edc__VersionProfile
              value: {{ .Values.edc.versionProfile | quote }}
            - name: Drive__Edc__ApiKey
              valueFrom:
                secretKeyRef:
                  name: {{ include "drive.secretName" . }}
                  key: edc-api-key
            - name: Drive__DeliveryTokens__Keys__1
              valueFrom:
                secretKeyRef:
                  name: {{ include "drive.secretName" . }}
                  key: delivery-token-key-1
            - name: Drive__DeliveryTokens__CurrentVersion
              value: "1"
            - name: Storage__FileSystem__RootPath
              value: /data
            {{- if .Values.postgres.enabled }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "drive.secretName" . }}
                  key: postgres-password
            - name: ConnectionStrings__Drive
              value: "Host={{ include "drive.fullname" . }}-postgres;Port=5432;Database=drive;Username=drive;Password=$(POSTGRES_PASSWORD)"
            {{- else }}
            - name: ConnectionStrings__Drive
              valueFrom:
                secretKeyRef:
                  name: {{ include "drive.secretName" . }}
                  key: connection-string
            {{- end }}
            - name: Auth__Oidc__Authority
              value: {{ required "oidc.authority ist Pflicht" .Values.oidc.authority | quote }}
            - name: Auth__Oidc__ClientId
              value: {{ .Values.oidc.clientId | quote }}
            - name: Auth__Oidc__ClientSecret
              valueFrom:
                secretKeyRef:
                  name: {{ include "drive.secretName" . }}
                  key: oidc-client-secret
            - name: Auth__Oidc__RoleClaim
              value: {{ .Values.oidc.roleClaim | quote }}
            - name: Auth__Oidc__GroupClaim
              value: {{ .Values.oidc.groupClaim | quote }}
            - name: Scanning__ClamAv__Host
              value: {{ include "drive.clamavHost" . | quote }}
            - name: Scanning__ClamAv__Port
              value: {{ .Values.scanning.clamavPort | quote }}
            - name: Scanning__ClamAv__MaxStreamBytes
              value: {{ .Values.scanning.maxStreamBytes | int64 | quote }}
            - name: Scanning__Required
              value: {{ .Values.scanning.required | quote }}
            - name: Uploads__ChunkSize
              value: {{ .Values.uploads.chunkSize | int64 | quote }}
            - name: Uploads__MaxFileSize
              value: {{ .Values.uploads.maxFileSize | int64 | quote }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "drive.claimName" . }}
        - name: tmp
          emptyDir: {}
