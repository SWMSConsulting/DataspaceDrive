{{- if .Values.postgres.enabled }}
# Eigene PostgreSQL-Instanz der Drive (Metadaten, Audit, Data-Protection-Schlüssel); die Dateien liegen im Daten-PVC.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "drive.fullname" . }}-postgres
  labels:
    {{- include "drive.componentLabels" (dict "root" . "component" "postgres") | nindent 4 }}
spec:
  serviceName: {{ include "drive.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "drive.componentSelectorLabels" (dict "root" . "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "drive.componentLabels" (dict "root" . "component" "postgres") | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        # Nutzer "postgres" im Alpine-Image
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: drive
            - name: POSTGRES_DB
              value: drive
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "drive.secretName" . }}
                  key: postgres-password
            # Unterverzeichnis, damit lost+found im Volume-Root initdb nicht stört.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "drive", "-d", "drive"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "drive", "-d", "drive"]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.postgres.storageClass | quote }}
        resources:
          requests:
            storage: {{ .Values.postgres.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "drive.fullname" . }}-postgres
  labels:
    {{- include "drive.componentLabels" (dict "root" . "component" "postgres") | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    {{- include "drive.componentSelectorLabels" (dict "root" . "component" "postgres") | nindent 4 }}
---
{{- if .Values.networkPolicy.enabled }}
# Nur der Drive-Pod spricht mit seiner Datenbank.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "drive.fullname" . }}-postgres
  labels:
    {{- include "drive.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "drive.componentSelectorLabels" (dict "root" . "component" "postgres") | nindent 6 }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "drive.selectorLabels" . | nindent 14 }}
      ports:
        - port: 5432
          protocol: TCP
{{- end }}
{{- end }}
