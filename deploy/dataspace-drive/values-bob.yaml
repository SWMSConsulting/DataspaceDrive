# Instanz für bob (windx-Dataspace). Die Geheimnisse liegen im Secret dataspace-drive-bob-secrets
# (Schlüssel edc-api-key, delivery-token-key-1); Anlage siehe README, Abschnitt Deployment.
fullnameOverride: dataspace-drive-bob

participant:
  id: "did:web:bob-windx.cluster.swms-cloud.com"
  bpn: "BPNL00000000WB02"
  dspAddress: "https://bob-edc-windx.cluster.swms-cloud.com/api/v1/dsp"

edc:
  managementUrl: "http://bob-edc-controlplane:8081/management"

ingress:
  host: drive-bob-windx.cluster.swms-cloud.com
  tlsSecretName: dataspace-drive-bob-tls

existingSecret: dataspace-drive-bob-secrets

storage:
  size: 5Gi

# Gemeinsame Demo-Dienste aus deploy/windx-shared (ein Keycloak-Realm je Unternehmen, ein ClamAV für alle).
oidc:
  authority: https://sso-windx.cluster.swms-cloud.com/realms/bob

scanning:
  clamavHost: clamav.windx-shared.svc.cluster.local
