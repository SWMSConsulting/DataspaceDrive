# Instanz für alice (windx-Dataspace). Die Geheimnisse liegen im Secret dataspace-drive-alice-secrets
# (Schlüssel edc-api-key, delivery-token-key-1); Anlage siehe README, Abschnitt Deployment.
fullnameOverride: dataspace-drive-alice

participant:
  id: "did:web:alice-windx.cluster.swms-cloud.com"
  bpn: "BPNL00000000WA01"
  dspAddress: "https://alice-edc-windx.cluster.swms-cloud.com/api/v1/dsp"
  organization: "Alice (windx-Demo)"

edc:
  managementUrl: "http://alice-edc-controlplane:8081/management"

ingress:
  host: drive-alice-windx.cluster.swms-cloud.com
  tlsSecretName: dataspace-drive-alice-tls

existingSecret: dataspace-drive-alice-secrets

storage:
  size: 5Gi

# Gemeinsame Demo-Dienste aus deploy/windx-shared (ein Keycloak-Realm je Unternehmen, ein ClamAV für alle).
oidc:
  authority: https://sso-windx.cluster.swms-cloud.com/realms/alice

scanning:
  clamavHost: clamav.windx-shared.svc.cluster.local
