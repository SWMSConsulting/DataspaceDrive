# Eine Instanz je Unternehmen, im Namespace neben dessen EDC-Connector.
replicaCount: 1   # Dateisystem-Ablage auf RWO-PVC: genau eine Replik (Strategy Recreate)

image:
  repository: ghcr.io/swmsconsulting/dataspacedrive
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

# Koordinaten dieses Unternehmens im Dataspace.
participant:
  id: ""            # DID, z. B. did:web:alice-windx.cluster.swms-cloud.com
  bpn: ""           # BPNL...
  dspAddress: ""    # https://<connector>/api/v1/dsp
  organization: ""  # Name, den Partner als Absender sehen

# Freigaben an Partner
sharing:
  defaultLifetimeDays: 30
  maxLifetimeDays: 90
  # membership (Standard) oder cx (FrameworkAgreement + UsagePurpose; braucht passende DEG-Credentials bei allen Partnern)
  contractProfile: membership
  # Vorgabe für das Vier-Augen-Prinzip; die Verwaltung kann es in der Oberfläche umschalten.
  requireApproval: false

# E-Mail-Benachrichtigungen über SMTP; ohne Host verschickt die Drive keine E-Mails.
# Ein Passwort steht im Secret unter smtp-password (optional).
mail:
  smtpHost: ""
  smtpPort: 25
  useStartTls: false
  username: ""
  from: "DataspaceDrive <noreply@example.com>"

# Eingang: Abfrage der Partnerkataloge und Abruf in Abschnitten
inbox:
  pollInterval: "00:02:00"
  segmentSizeBytes: 67108864

edc:
  managementUrl: "" # clusterintern, z. B. http://alice-edc-controlplane:8081/management
  versionProfile: tractusx-0.12

ports:
  app: 8080
  content: 8090

# Anmeldung über den Identity Provider des Unternehmens (OIDC Authorization Code Flow im Backend).
oidc:
  authority: ""     # Realm-URL, z. B. https://sso.example.com/realms/firma
  clientId: dataspace-drive
  roleClaim: roles
  groupClaim: groups

# Eigene PostgreSQL-Instanz je Drive; ohne sie liest die Drive den Schlüssel connection-string aus dem Secret.
postgres:
  enabled: true
  image: postgres:16-alpine
  storageClass: csi-cinder-high-speed-gen2-luks
  size: 2Gi
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi

# Virenscan: entweder ein eingebetteter ClamAV (clamav.enabled) oder ein vorhandener clamd (scanning.clamavHost).
scanning:
  clamavHost: ""
  clamavPort: 3310
  # Muss zu StreamMaxLength in clamd.conf passen (2047 MiB; ClamAV prüft höchstens 2 GiB - 1 Byte).
  # Mit Virenscan werden größere Uploads abgelehnt, weil ungeprüfte Dateien gesperrt blieben.
  maxStreamBytes: 2146435072
  required: true

clamav:
  enabled: false
  image: clamav/clamav:1.5.4
  resources:
    requests:
      cpu: 100m
      memory: 1200Mi
    limits:
      memory: 2Gi

uploads:
  chunkSize: 8388608
  maxFileSize: 10737418240

storage:
  # Verschlüsselte StorageClass (LUKS) für die Dateiablage.
  storageClass: csi-cinder-high-speed-gen2-luks
  size: 50Gi
  existingClaim: ""

# Geheimnisse: entweder hier (nur per --set beim Deploy) oder über existingSecret mit den Schlüsseln
# edc-api-key, delivery-token-key-1 (Base64, mindestens 32 Bytes), postgres-password und oidc-client-secret.
secrets:
  create: true
  edcApiKey: ""
  deliveryTokenKey: ""
  postgresPassword: ""
  oidcClientSecret: ""
existingSecret: ""

service:
  port: 80

ingress:
  enabled: true
  className: nginx
  host: drive.example.com
  clusterIssuer: letsencrypt-prod
  tlsSecretName: dataspace-drive-tls
  # Nur intern erreichbar machen, z. B. "203.0.113.0/24". Leer = keine Einschränkung am Ingress.
  whitelistSourceRange: ""
  # Uploads laufen in Teilstücken; die Grenze muss über der Chunk-Größe liegen.
  proxyBodySize: 16m
  # Das Anmelde-Cookie kommt als großer Set-Cookie-Header zurück; der nginx-Standard (4k) führt zu 502.
  proxyBufferSize: 16k
  # Der Abschluss eines großen Uploads berechnet die Prüfsumme über die ganze Datei.
  proxyTimeoutSeconds: 600
  extraAnnotations: {}

networkPolicy:
  enabled: true
  # Pods, die den Content-Port erreichen dürfen: die Dataplane des eigenen Connectors.
  dataplanePodLabels:
    app.kubernetes.io/name: tractusx-connector-dataplane
  ingressControllerNamespace: ingress-nginx

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

podSecurityContext:
  runAsNonRoot: true
  # Das aspnet-Image läuft als APP_UID 1654; fsGroup macht das PVC für diesen Nutzer beschreibbar.
  fsGroup: 1654
  fsGroupChangePolicy: OnRootMismatch
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
