# Gemeinsame Demo-Dienste für die DataspaceDrive-Instanzen im windx-Dataspace (Namespace windx-shared):
# Keycloak (ein Realm je Unternehmen) mit eigener PostgreSQL und ein ClamAV für alle Instanzen.
# Geheimnisse liefert deploy.sh als Secrets windx-shared-secrets und keycloak-realms.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keycloak-postgres
  labels:
    app.kubernetes.io/name: keycloak-postgres
    app.kubernetes.io/part-of: windx-shared
spec:
  serviceName: keycloak-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak-postgres
        app.kubernetes.io/part-of: windx-shared
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: keycloak
            - name: POSTGRES_DB
              value: keycloak
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: windx-shared-secrets
                  key: keycloak-db-password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "keycloak", "-d", "keycloak"]
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: csi-cinder-high-speed-gen2-luks
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak-postgres
  labels:
    app.kubernetes.io/name: keycloak-postgres
spec:
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    app.kubernetes.io/name: keycloak-postgres
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak-postgres
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keycloak-postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak
      ports:
        - port: 5432
          protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/part-of: windx-shared
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/part-of: windx-shared
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.6
          # Produktionsmodus; vorhandene Realms überspringt --import-realm, Änderungen in der Konsole bleiben erhalten.
          args: ["start", "--import-realm"]
          env:
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://keycloak-postgres:5432/keycloak
            - name: KC_DB_USERNAME
              value: keycloak
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: windx-shared-secrets
                  key: keycloak-db-password
            - name: KC_HOSTNAME
              value: https://sso-windx.cluster.swms-cloud.com
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: windx-shared-secrets
                  key: keycloak-admin-password
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          # Das Standard-Image baut beim Start neu (ca. 40 s); die Startprobe lässt dafür Zeit.
          startupProbe:
            httpGet:
              path: /health/started
              port: management
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 800Mi
            limits:
              memory: 1536Mi
          volumeMounts:
            - name: realms
              mountPath: /opt/keycloak/data/import
              readOnly: true
      volumes:
        - name: realms
          secret:
            secretName: keycloak-realms
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
spec:
  ports:
    - name: http
      port: 8080
      targetPort: http
  selector:
    app.kubernetes.io/name: keycloak
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-buffer-size: 16k
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["sso-windx.cluster.swms-cloud.com"]
      secretName: keycloak-tls
  rules:
    - host: sso-windx.cluster.swms-cloud.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
---
# Keycloak nur über den Ingress-Controller; die Drive-Instanzen sprechen ihn über die öffentliche URL an.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8080
          protocol: TCP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: clamav
  labels:
    app.kubernetes.io/name: clamav
data:
  clamd.conf: |
    Foreground yes
    LogTime yes
    LogClean no
    DatabaseDirectory /var/lib/clamav
    TemporaryDirectory /tmp
    LocalSocket /tmp/clamd.sock
    TCPSocket 3310
    TCPAddr 0.0.0.0
    MaxThreads 4
    ReadTimeout 300
    CommandReadTimeout 30
    # ClamAV prüft höchstens 2 GiB - 1 Byte; größere Dateien gelten als nicht prüfbar.
    StreamMaxLength 2047M
    MaxFileSize 2047M
    MaxScanSize 2047M
    # Überschrittene Limits melden statt eine nur teilweise geprüfte Datei als sauber auszugeben.
    AlertExceedsMax yes
    MaxScanTime 600000
    ConcurrentDatabaseReload no
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clamav
  labels:
    app.kubernetes.io/name: clamav
    app.kubernetes.io/part-of: windx-shared
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clamav
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clamav
        app.kubernetes.io/part-of: windx-shared
    spec:
      containers:
        - name: clamav
          image: clamav/clamav:1.5.4
          ports:
            - name: clamd
              containerPort: 3310
          readinessProbe:
            tcpSocket:
              port: clamd
            initialDelaySeconds: 60
            periodSeconds: 15
          livenessProbe:
            tcpSocket:
              port: clamd
            initialDelaySeconds: 300
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 1200Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /etc/clamav/clamd.conf
              subPath: clamd.conf
      volumes:
        - name: config
          configMap:
            name: clamav
---
apiVersion: v1
kind: Service
metadata:
  name: clamav
  labels:
    app.kubernetes.io/name: clamav
spec:
  ports:
    - name: clamd
      port: 3310
      targetPort: clamd
  selector:
    app.kubernetes.io/name: clamav
---
# clamd nur für die Drive-Pods der Teilnehmer.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clamav
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: clamav
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: ["windx-alice", "windx-bob", "windx-dave"]
          podSelector:
            matchLabels:
              app.kubernetes.io/name: dataspace-drive
      ports:
        - port: 3310
          protocol: TCP
---
# Mailpit fängt die E-Mails der Drive-Instanzen ab (Demo); Ansicht nur per kubectl port-forward auf 8025.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailpit
  labels:
    app.kubernetes.io/name: mailpit
    app.kubernetes.io/part-of: windx-shared
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mailpit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mailpit
        app.kubernetes.io/part-of: windx-shared
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.31.2
          env:
            - name: MP_MAX_MESSAGES
              value: "2000"
          ports:
            - name: smtp
              containerPort: 1025
            - name: http
              containerPort: 8025
          readinessProbe:
            tcpSocket:
              port: smtp
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: mailpit
  labels:
    app.kubernetes.io/name: mailpit
spec:
  selector:
    app.kubernetes.io/name: mailpit
  ports:
    - name: smtp
      port: 1025
      targetPort: smtp
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mailpit
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mailpit
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: ["windx-alice", "windx-bob", "windx-dave"]
          podSelector:
            matchLabels:
              app.kubernetes.io/name: dataspace-drive
      ports:
        - port: 1025
          protocol: TCP
