<dx-tree-view
  dataStructure="plain"
  keyExpr="id"
  displayExpr="text"
  parentIdExpr="parentId"
  hasItemsExpr="hasItems"
  selectionMode="single"
  [selectByClick]="true"
  [createChildren]="createChildren"
  [height]="height()"
  (onItemSelectionChanged)="onSelectionChanged($event)"
></dx-tree-view>
