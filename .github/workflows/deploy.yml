name: deploy

# Eine Instanz je Teilnehmer im Namespace windx-<teilnehmer>, neben dessen EDC-Connector.
# Kubeconfig je Teilnehmer aus KUBECONFIG_<TEILNEHMER>, sonst aus der gemeinsamen KUBECONFIG.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image-Tag in GHCR (z. B. latest oder sha-abc1234)'
        required: true
        default: 'latest'
      target:
        description: 'Welche Instanz(en) deployen'
        type: choice
        options: [all, alice, bob, dave]
        default: all

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - participant: alice
            prefix: ALICE
          - participant: bob
            prefix: BOB
          - participant: dave
            prefix: DAVE
    steps:
      - name: Skip non-selected
        id: guard
        run: |
          if [ "${{ inputs.target }}" != "all" ] && [ "${{ inputs.target }}" != "${{ matrix.participant }}" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'

      - uses: azure/setup-helm@v4
        if: steps.guard.outputs.skip != 'true'

      - name: Check kubeconfig secret
        if: steps.guard.outputs.skip != 'true'
        env:
          KUBECONFIG_B64: ${{ secrets[format('KUBECONFIG_{0}', matrix.prefix)] || secrets.KUBECONFIG }}
        run: |
          if [ -z "$KUBECONFIG_B64" ]; then
            echo "::error::Fehlendes GitHub-Secret KUBECONFIG_${{ matrix.prefix }} (oder KUBECONFIG)"
            exit 1
          fi

      - name: Write kubeconfig
        if: steps.guard.outputs.skip != 'true'
        env:
          KUBECONFIG_B64: ${{ secrets[format('KUBECONFIG_{0}', matrix.prefix)] || secrets.KUBECONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBECONFIG_B64" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      # Die Geheimnisse liegen als Secret im Namespace (existingSecret in values-<teilnehmer>.yaml), damit sie
      # weder in GitHub noch in der Helm-Release-Historie stehen und der Token-Schlüssel stabil bleibt.
      - name: Check participant secret
        if: steps.guard.outputs.skip != 'true'
        run: |
          kubectl -n "windx-${{ matrix.participant }}" get secret "dataspace-drive-${{ matrix.participant }}-secrets" > /dev/null \
            || { echo "::error::Secret dataspace-drive-${{ matrix.participant }}-secrets fehlt (siehe README)"; exit 1; }

      - name: Helm upgrade ${{ matrix.participant }}
        if: steps.guard.outputs.skip != 'true'
        run: |
          helm upgrade --install "dataspace-drive-${{ matrix.participant }}" deploy/dataspace-drive \
            --namespace "windx-${{ matrix.participant }}" \
            -f "deploy/dataspace-drive/values-${{ matrix.participant }}.yaml" \
            --set image.tag="${{ inputs.image_tag }}" \
            --wait --timeout 5m
